# Sample stack. The authoritative deployment for this environment lives at
# C:\docker-compose\environments\o-man-lxc\stacks\scare7\docker-compose.yml
# and is managed by Dockhand.

services:
  slasher-archive:
    image: ghcr.io/siahmurph/slasher-archive:2.0.1
    container_name: slasher-archive
    restart: unless-stopped
    ports:
      - "8383:8080"
    environment:
      - PORT=8080
      - CONFIG_DIR=/config
    volumes:
      # Holds config.json with your TMDb/Radarr/Emby API keys in plaintext.
      # Required — without it, settings are lost on every container recreate.
      # The container runs as uid 1000, so the host directory must be owned by
      # it:  chown -R 1000:1000 /opt/appdata/slasher-archive
      - /opt/appdata/slasher-archive:/config
